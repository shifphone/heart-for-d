<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Для Даны">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Сердце для Даны</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Playfair+Display:ital,wght@1,400;1,700&display=swap">
<style>
  /* Layout: full-screen canvas; tap veil, envelope and letter float above it. Single deliberate night look. */
  :root {
    --bg: #02040a;
    --pink: #ff4f93;
    --pink-light: #ffc2db;
    --rose-ink: #ffd6e6;
    --wish-ink: #f3c9da;
    --paper: #fff4f8;
    --sheet-a: #1d0815;
    --sheet-b: #0b0309;
    --hint: rgba(255, 170, 205, 0.7);
    --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
    --font-word: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--rose-ink);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--bg); color: var(--hint);
    border: 0; padding: 0; margin: 0; cursor: pointer;
    font: 800 12px/1 var(--font-word); letter-spacing: 0.4em; text-transform: uppercase;
    transition: opacity 0.9s ease;
  }
  #start.gone { opacity: 0; pointer-events: none; }
  #start svg {
    width: 68px; height: 68px;
    filter: drop-shadow(0 0 16px var(--pink));
    animation: beat 1.4s ease-in-out infinite;
  }
  #start:focus-visible, #env:focus-visible, .close:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; border-radius: 12px; }
  #start:focus-visible { outline-offset: -8px; }

  #env {
    position: fixed; left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: none; border: 0; padding: 8px 14px; cursor: pointer;
    color: var(--hint);
    font: 800 11px/1 var(--font-word); letter-spacing: 0.3em; text-transform: uppercase;
    opacity: 0; transition: opacity 1.4s ease;
  }
  #env.show { opacity: 1; }
  #env svg { width: 50px; height: 36px; filter: drop-shadow(0 0 10px var(--pink)); animation: bob 2.6s ease-in-out infinite; }

  #letter {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(2, 4, 10, 0.74);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.5s ease;
  }
  #letter.open { opacity: 1; }
  .sheet {
    position: relative; box-sizing: border-box;
    width: 100%; max-width: 420px; max-height: 100%; overflow: auto; overflow-x: hidden;
    background: linear-gradient(160deg, var(--sheet-a), var(--sheet-b));
    border: 1px solid rgba(255, 79, 147, 0.35);
    border-radius: 20px;
    box-shadow: 0 0 46px rgba(255, 79, 147, 0.25), inset 0 0 34px rgba(255, 79, 147, 0.06);
    padding: 40px 28px 30px;
    transform: translateY(18px) scale(0.97);
    transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #letter.open .sheet { transform: none; }
  .sheet h2 {
    margin: 0 0 24px;
    padding-right: 24px;
    font: italic 700 clamp(25px, 7.4vw, 31px)/1.2 var(--font-display);
    color: var(--pink-light);
    text-shadow: 0 0 18px rgba(255, 79, 147, 0.75), 0 0 2px rgba(255, 79, 147, 0.9);
    text-wrap: balance;
  }
  .row { display: flex; align-items: center; gap: 16px; }
  .row + .row { margin-top: 20px; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .line {
    display: block;
    font: italic 400 clamp(19px, 5.6vw, 22px)/1.3 var(--font-display);
    color: var(--rose-ink);
  }
  .snap {
    flex: none; margin: 0;
    width: clamp(88px, 26vw, 112px);
    background: var(--paper);
    padding: 5px 5px 17px;
    border-radius: 3px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 79, 147, 0.18);
    transform: rotate(var(--tilt));
    position: relative;
  }
  .snap::after {
    content: ""; position: absolute; left: 50%; bottom: 3px;
    width: 12px; height: 11px; transform: translateX(-50%);
    background: var(--pink);
    clip-path: path("M6 11C2.6 8.4 0.4 6.3 0.4 3.7 0.4 1.9 1.8 0.4 3.6 0.4c1 0 1.9 0.5 2.4 1.3C6.5 0.9 7.4 0.4 8.4 0.4 10.2 0.4 11.6 1.9 11.6 3.7 11.6 6.3 9.4 8.4 6 11z");
  }
  .snap img {
    display: block; width: 100%; max-width: 100%;
    aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 2px;
  }
  .wish {
    flex: 1; min-width: 0; margin: 0;
    font: 600 15.5px/1.55 var(--font-word);
    color: var(--wish-ink);
  }
  .seal { display: flex; justify-content: flex-end; margin-top: 18px; }
  .seal svg { width: 26px; height: 24px; filter: drop-shadow(0 0 8px var(--pink)); }
  .close {
    position: absolute; top: 10px; right: 10px;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer;
    color: var(--hint); font: 400 28px/1 var(--font-word);
  }

  #letter.open .fx { animation: rise 0.7s ease both; animation-delay: var(--d); }
  #letter.open .snap { animation: drop 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--d); }

  #diag {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 50; white-space: pre-wrap;
    background: #2a0b1c; color: #ffd6e6; border: 1px solid #ff4f93; border-radius: 10px;
    padding: 10px 12px; font: 600 12px/1.4 var(--font-word);
    -webkit-user-select: text; user-select: text;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.16); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px) rotate(0deg) scale(0.92); } to { opacity: 1; transform: rotate(var(--tilt)); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #start svg, #env svg { animation: none; }
    #letter.open .fx, #letter.open .snap { animation: none; }
  }
</style>

</head>

<canvas id="c" aria-label="Сердце из светящихся слов love you"></canvas>

<button id="start" type="button" aria-label="Начать">
  <svg viewBox="0 0 32 30" aria-hidden="true">
    <path fill="#ff4f93" d="M16 29C7 22 1 16.5 1 9.6 1 4.8 4.8 1 9.4 1c2.8 0 5.2 1.4 6.6 3.6C17.4 2.4 19.8 1 22.6 1 27.2 1 31 4.8 31 9.6 31 16.5 25 22 16 29z"/>
  </svg>
  <span>нажми</span>
</button>

  <svg viewBox="0 0 50 36" aria-hidden="true">

  </svg>
  <span>письмо для тебя</span>
</button>

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const startBtn = document.getElementById("start");
  const env = document.getElementById("env");
  const letter = document.getElementById("letter");
  const closeBtn = letter.querySelector(".close");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rootStyle = getComputedStyle(document.documentElement);
  const WORD_FONT = rootStyle.getPropertyValue("--font-word").trim();
  const DISPLAY_FONT = rootStyle.getPropertyValue("--font-display").trim();
  const BG = "#02040a";
  const HEART_PATH = new Path2D("M16 29C7 22 1 16.5 1 9.6 1 4.8 4.8 1 9.4 1c2.8 0 5.2 1.4 6.6 3.6C17.4 2.4 19.8 1 22.6 1 27.2 1 31 4.8 31 9.6 31 16.5 25 22 16 29z");

  let W = 0, H = 0, DPR = 1, S = 10, cx = 0, cy = 0;
  let particles = [], fillStart = 0, centerStart = 0;
  let spriteCache = new Map(), petalSprite = null, heartSprite = null;
  const petals = [], bursts = [];
  let started = false, startTs = null, lastTs = null;
  const audio = CONFIG.music ? new Audio(CONFIG.music) : null;
  if (audio) audio.loop = true;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Classic parametric heart, y flipped for screen space. Range: x ±16, y −12…17.
  function heartXY(t) {
    const s = Math.sin(t);
    return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
  }
  function toScreen(x, y) { return [cx + x * S, cy + (y - 2.5) * S]; }

  function makeParticle(rnd, x, y, order, kind) {
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    return {
      x, y, order, kind,
      word: pick(CONFIG.words),
      color: pick(CONFIG.colors),
      flicker: rnd() * Math.PI * 2,
      size: 0.85 + rnd() * 0.3,
      rate: (14 + rnd() * 4) * 60 / 255,
      delay: 0,
      sprite: null
    };
  }

  function build() {
    const rnd = mulberry32(20261020);
    const outline = [], placed = [];
    const gapO = 1.5 * S, nOutline = 160;
    for (let i = 0; i < nOutline; i++) {
      const t = (i / nOutline) * Math.PI * 2;
      const [sx, sy] = toScreen(...heartXY(t));
      if (placed.some((p) => Math.hypot(sx - p[0], sy - p[1]) < gapO)) continue;
      placed.push([sx, sy]);
      outline.push(makeParticle(rnd, sx, sy, i, "outline"));
    }
    const fill = [], placedF = [];
    const gapF = 2.3 * S, nFill = 130;
    let attempts = 0;
    while (fill.length < nFill && attempts < nFill * 80) {
      attempts++;
      const t = rnd() * Math.PI * 2;
      const r = rnd() * 0.86;
      const [bx, by] = heartXY(t);
      const [sx, sy] = toScreen(bx * r, by * r);
      if (placedF.some((p) => Math.hypot(sx - p[0], sy - p[1]) < gapF)) continue;
      placedF.push([sx, sy]);
      fill.push(makeParticle(rnd, sx, sy, Math.floor(rnd() * 321), "fill"));
    }
    const span = outline.length ? Math.max(...outline.map((p) => p.order)) : 0;
    fillStart = (span * 1.6 + 30) / 60;
    centerStart = fillStart + 200 / 60;
    outline.forEach((p) => { p.delay = (p.order * 1.6) / 60; });
    fill.forEach((p) => { p.delay = fillStart + p.order / 60; });
    particles = outline.concat(fill);
    particles.forEach((p) => {
      const base = p.kind === "outline" ? 1.0 * S : 0.85 * S;
      const fs = Math.max(7, Math.round(base * p.size * 2) / 2);
      p.sprite = getSprite(p.word, p.color, fs);
    });
  }

  function getSprite(word, color, fs) {
    const key = word + "|" + color + "|" + fs;
    if (spriteCache.has(key)) return spriteCache.get(key);
    const font = `800 ${fs}px ${WORD_FONT}`;
    ctx.font = font;
    const tw = ctx.measureText(word).width;
    const pad = fs * 1.6;
    const cw = tw + pad * 2, ch = fs + pad * 2;
    const c = document.createElement("canvas");
    c.width = Math.ceil(cw * DPR); c.height = Math.ceil(ch * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    g.font = font; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = color; g.shadowColor = color;
    g.shadowBlur = fs * 1.3 * DPR; g.globalAlpha = 0.5; g.fillText(word, cw / 2, ch / 2);
    g.shadowBlur = fs * 0.5 * DPR; g.globalAlpha = 0.8; g.fillText(word, cw / 2, ch / 2);
    g.shadowBlur = 0; g.globalAlpha = 1; g.fillText(word, cw / 2, ch / 2);
    const sprite = { c, w: cw, h: ch };
    spriteCache.set(key, sprite);
    return sprite;
  }

  function makePetalSprite() {
    const sz = 32;
    const c = document.createElement("canvas");
    c.width = c.height = Math.ceil(sz * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    const grad = g.createRadialGradient(sz * 0.45, sz * 0.4, 1, sz / 2, sz / 2, sz * 0.48);
    grad.addColorStop(0, "rgba(255,214,230,0.95)");
    grad.addColorStop(0.6, "rgba(255,111,168,0.75)");
    grad.addColorStop(1, "rgba(255,79,147,0)");
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(sz / 2, sz / 2, sz * 0.3, sz * 0.46, 0, 0, Math.PI * 2);
    g.fill();
    return { c, size: sz };
  }

  function makeHeartSprite() {
    const sz = 48, pad = 14;
    const c = document.createElement("canvas");
    c.width = c.height = Math.ceil((sz + pad * 2) * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    g.translate(pad, pad + sz * 0.03);
    g.scale(sz / 32, sz / 32);
    g.shadowColor = "#ff4f93"; g.shadowBlur = 12 * DPR;
    g.fillStyle = "#ff6fa8"; g.fill(HEART_PATH);
    g.shadowBlur = 0;
    const grad = g.createLinearGradient(0, 0, 0, 30);
    grad.addColorStop(0, "#ffc2db"); grad.addColorStop(1, "#ff3d7f");
    g.fillStyle = grad; g.fill(HEART_PATH);
    return { c, sz, total: sz + pad * 2 };
  }

  function newPetal(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -30 - Math.random() * 60,
      vy: 16 + Math.random() * 26,
      sway: 10 + Math.random() * 26,
      ph: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 1.2,
      size: (0.7 + Math.random() * 0.7) * S,
      a: 0.22 + Math.random() * 0.28
    };
  }
  function initPetals() {
    petals.length = 0;
    const n = Math.round(Math.min(28, 12 + W / 70));
    for (let i = 0; i < n; i++) petals.push(newPetal(true));
  }
  function drawPetals(now, dt) {
    if (reduceMotion) return;
    const fade = Math.min(1, Math.max(0, (now - fillStart) / 3));
    if (fade <= 0) return;
    const k = S / 10;
    for (const p of petals) {
      p.y += p.vy * k * dt; p.rot += p.vr * dt; p.ph += dt * 1.3;
      if (p.y > H + 40) Object.assign(p, newPetal(false));
      const x = p.x + Math.sin(p.ph) * p.sway * k;
      ctx.save();
      ctx.translate(x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, 0.55 + 0.45 * Math.abs(Math.cos(p.ph * 0.8)));
      ctx.globalAlpha = p.a * fade;
      ctx.drawImage(petalSprite.c, -p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  function burst(x, y, n) {
    if (!heartSprite) return;
    const k = S / 10;
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
      const sp = (70 + Math.random() * 130) * k;
      bursts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0, max: 1.3 + Math.random() * 0.9,
        sz: (1.1 + Math.random() * 1.3) * S,
        rot: (Math.random() - 0.5) * 0.7, vr: (Math.random() - 0.5) * 2
      });
    }
    if (bursts.length > 220) bursts.splice(0, bursts.length - 220);
  }
  function drawBursts(dt) {
    const k = S / 10;
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life += dt;
      if (b.life >= b.max) { bursts.splice(i, 1); continue; }
      b.vx *= Math.pow(0.15, dt);
      b.vy = b.vy * Math.pow(0.3, dt) - 28 * k * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      const t = b.life / b.max;
      const a = t < 0.12 ? t / 0.12 : 1 - (t - 0.12) / 0.88;
      const s = b.sz * (0.5 + 0.5 * Math.min(1, t * 6));
      const d = s * heartSprite.total / heartSprite.sz;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.globalAlpha = Math.max(0, a);
      ctx.drawImage(heartSprite.c, -d / 2, -d / 2, d, d);
      ctx.restore();
    }
  }

  // Lub-dub heartbeat, 0…~1, starts once the heart is complete
  function beatAt(now) {
    if (reduceMotion || now < centerStart) return 0;
    const e = now - centerStart;
    const ramp = Math.min(1, e / 2);
    const ph = e % 1.25;
    const g = (x, m) => Math.exp(-(((x - m) / 0.075) ** 2));
    return ramp * (g(ph, 0.05) + 0.6 * g(ph, 0.3) + g(ph, 1.3));
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W / 38, H / 40);
    cx = W / 2; cy = H / 2 - 1.2 * S;
    spriteCache = new Map();
    petalSprite = makePetalSprite();
    heartSprite = makeHeartSprite();
    build();
    initPetals();
  }

  function draw(ts) {
    requestAnimationFrame(draw);
    if (!started) return;
    if (startTs === null) startTs = ts;
    const dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    const now = (ts - startTs) / 1000;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    const beat = beatAt(now);
    const [hx, hy] = toScreen(0, 2);
    const haze = Math.min(1, now / (centerStart || 1));
    const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, 22 * S * (1 + 0.06 * beat));
    grad.addColorStop(0, `rgba(255,79,147,${(0.12 + 0.05 * beat) * haze})`);
    grad.addColorStop(1, "rgba(255,79,147,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawPetals(now, dt);

    const k = 1 + 0.04 * beat;
    ctx.save();
    ctx.translate(hx, hy); ctx.scale(k, k); ctx.translate(-hx, -hy);
    for (const p of particles) {
      const a = Math.min(1, Math.max(0, (now - p.delay) * p.rate));
      if (a <= 0) continue;
      const flick = a >= 1 && !reduceMotion ? 0.75 + 0.25 * Math.sin(now * 2.4 + p.flicker) : 1;
      ctx.globalAlpha = a * flick;
      const s = p.sprite;
      ctx.drawImage(s.c, p.x - s.w / 2, p.y - s.h / 2, s.w, s.h);
    }
    ctx.restore();

    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (now > centerStart) {
      const ca = 1 - Math.exp(-Math.min(1, now - centerStart) * 8);
      const [tx, ty] = toScreen(0, 0);
      let fs = 2.7 * S;
      ctx.font = `italic 700 ${fs}px ${DISPLAY_FONT}`;
      const maxW = 22 * S;
      let w = ctx.measureText(CONFIG.center).width;
      if (w > maxW) { fs *= maxW / w; w = maxW; }
      const pool = ctx.createRadialGradient(tx, ty, 0, tx, ty, w * 0.75);
      pool.addColorStop(0, `rgba(2,4,10,${0.85 * ca})`);
      pool.addColorStop(1, "rgba(2,4,10,0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = pool;
      ctx.fillRect(tx - maxW, ty - maxW, maxW * 2, maxW * 2);

      const f = fs * (1 + 0.05 * beat);
      ctx.font = `italic 700 ${f}px ${DISPLAY_FONT}`;
      ctx.globalAlpha = ca;
      ctx.fillStyle = "#ffc2db";
      ctx.shadowColor = "#ff4f93";
      ctx.shadowBlur = f * (0.6 + 0.3 * beat) * DPR;
      ctx.fillText(CONFIG.center, tx, ty);
      ctx.shadowBlur = 0;
      ctx.fillText(CONFIG.center, tx, ty);
    }

    if (now > centerStart + 3 && env.hidden) {
      env.hidden = false;
      requestAnimationFrame(() => env.classList.add("show"));
    }

    ctx.shadowBlur = 0;
    drawBursts(dt);
    ctx.globalAlpha = 1;
  }

  function onStart(e) {
    if (e && e.type === "touchend") e.preventDefault();
    if (started) return;
    started = true;
    startBtn.classList.add("gone");
    startBtn.setAttribute("tabindex", "-1");
    if (audio) { try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) {} }
  }
  startBtn.addEventListener("click", onStart);
  startBtn.addEventListener("touchend", onStart, { passive: false });

  canvas.addEventListener("pointerdown", (e) => {
    if (!started) return;
    burst(e.clientX, e.clientY, 7);
  });

  function openLetter() {
    letter.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => letter.classList.add("open")));
    closeBtn.focus({ preventScroll: true });
  }
  function closeLetter() {
    letter.classList.remove("open");
    setTimeout(() => { letter.hidden = true; }, 500);
    env.focus({ preventScroll: true });
  }
  env.addEventListener("click", openLetter);
  closeBtn.addEventListener("click", closeLetter);
  letter.addEventListener("click", (e) => { if (e.target === letter) closeLetter(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !letter.hidden) closeLetter(); });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  const fontsReady = document.fonts
    ? Promise.race([
        Promise.all([
          document.fonts.load(`800 16px ${WORD_FONT}`, CONFIG.words.join(" ")),
          document.fonts.load(`italic 700 40px ${DISPLAY_FONT}`, CONFIG.center)
        ]),
        new Promise((r) => setTimeout(r, 2500))
      ]).catch(() => {})
    : Promise.resolve();

  resize();
  fontsReady.then(() => { spriteCache = new Map(); build(); });
  requestAnimationFrame(draw);
</script>

</body>
</html>
